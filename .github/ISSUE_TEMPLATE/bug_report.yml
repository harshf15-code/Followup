name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: app
    attributes:
      label: App you captured from
      placeholder: e.g. Safari, Slack, Mail
  - type: dropdown
    id: backend
    attributes:
      label: AI backend
      options:
        - Claude (Claude Code)
        - Ollama
        - LM Studio
        - llama.cpp
        - Other OpenAI-compatible server
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: e.g. macOS 15.3, MacBook Air M2
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Followup version
      placeholder: e.g. 0.1.0
  - type: textarea
    id: logs
    attributes:
      label: Logs (optional)
      description: "Run `log show --last 5m --predicate 'subsystem == \"com.harshsharma.followup\"'` and paste the output. It never includes your captured text."
      render: text
