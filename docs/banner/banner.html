<!doctype html>
<!-- Source for docs/images/banner.png. Re-render with:
     "Google Chrome" --headless=new --hide-scrollbars --window-size=1280,640 --screenshot=docs/images/banner.png docs/banner/banner.html -->
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;width:1280px;height:640px;overflow:hidden}
  body{background:radial-gradient(1200px 600px at 85% 30%,#2b2745 0%,#14131d 60%,#0d0c13 100%);
       font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-style:normal;color:#F8F7F2;position:relative}
  .left{position:absolute;left:80px;top:150px;width:520px}
  .logo{width:120px;height:120px;margin-left:-14px}
  h1{font-size:80px;letter-spacing:-2.5px;margin:10px 0 12px;font-weight:700}
  p{font-size:26px;line-height:1.4;color:#c9c6d8;margin:0 0 28px}
  .keys{display:flex;gap:10px;align-items:center;font-size:20px;color:#9d99b3}
  kbd{font:500 24px "Helvetica Neue",Helvetica;color:#F8F7F2;background:#2a2838;border:1px solid #3d3a52;
      border-bottom-width:3px;border-radius:10px;padding:6px 14px}
  .map{position:absolute;right:-250px;top:120px;width:960px;border-radius:18px;opacity:.95;
       box-shadow:0 30px 80px rgba(0,0,0,.6);border:1px solid #2f2d40}
  .wheel{position:absolute;right:370px;top:290px;width:330px;filter:drop-shadow(0 25px 50px rgba(0,0,0,.7))}
  .dots{position:absolute;left:80px;bottom:56px;display:flex;gap:8px}
  .dots i{width:34px;height:6px;border-radius:3px;display:block}
</style></head><body>
  <img class="map" src="../images/mindmap.png">
  <img class="wheel" src="wheel-cut.png">
  <div class="left">
    <img class="logo" src="../../Support/brand/logo.svg">
    <h1>Followup</h1>
    <p>Select text anywhere, press a key,<br>and turn it into a plan.</p>
    <div class="keys"><kbd>⌃</kbd><kbd>F</kbd><span>&nbsp;on any selection</span></div>
  </div>
  <div class="dots"><i style="background:#F59E0B"></i><i style="background:#3B82F6"></i><i style="background:#10B981"></i><i style="background:#A855F7"></i><i style="background:#64748B"></i><i style="background:#EF4444"></i></div>
</body></html>
